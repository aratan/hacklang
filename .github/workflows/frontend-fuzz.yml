name: Frontend coverage-guided fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded libFuzzer campaign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz lexer
        run: cargo fuzz run lexer -- -max_total_time=15 -max_len=4096 -timeout=2
      - name: Fuzz parser in legacy and compact modes
        run: cargo fuzz run parser -- -max_total_time=15 -max_len=4096 -timeout=2
