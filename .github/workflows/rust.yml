name: Rust CI

on:
  push:
    branches: ["main", "feat/**", "feature/**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Type-check
        run: cargo check
      - name: Build
        run: cargo build
      - name: Run unit tests
        run: cargo test
      - name: Execute every supported .hl example
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.hl; do
            echo "Checking $file"
            if [[ "$file" == *_compact.hl ]]; then
              cargo run --quiet -- run --compact "$file"
            else
              cargo run --quiet -- "$file"
            fi
          done
      - name: Compare interpreter and native backend
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          source="examples/native_smoke.hl"
          cargo run --quiet -- run "$source" > "$temp_dir/interpreter.log"
          awk '
            /^--- Ejecutando código Hacklang ---$/ { capture = 1; next }
            /^--------------------------------$/ { capture = 0 }
            capture { print }
          ' "$temp_dir/interpreter.log" > "$temp_dir/interpreter.out"

          cargo run --quiet -- build "$source" -o "$temp_dir/native" > /dev/null
          "$temp_dir/native" > "$temp_dir/native.out"
          diff -u "$temp_dir/interpreter.out" "$temp_dir/native.out"

          compact_source="examples/native_smoke_compact.hl"
          cargo run --quiet -- run --compact "$compact_source" > "$temp_dir/compact-interpreter.log"
          awk '
            /^--- Ejecutando código Hacklang ---$/ { capture = 1; next }
            /^--------------------------------$/ { capture = 0 }
            capture { print }
          ' "$temp_dir/compact-interpreter.log" > "$temp_dir/compact-interpreter.out"
          diff -u "$temp_dir/interpreter.out" "$temp_dir/compact-interpreter.out"

          cargo run --quiet -- build --compact "$compact_source" -o "$temp_dir/native-compact" > /dev/null
          "$temp_dir/native-compact" > "$temp_dir/native-compact.out"
          diff -u "$temp_dir/interpreter.out" "$temp_dir/native-compact.out"

          functions_source="examples/test_functions.hl"
          cargo run --quiet -- run "$functions_source" > "$temp_dir/functions-interpreter.log"
          awk '
            /^--- Ejecutando código Hacklang ---$/ { capture = 1; next }
            /^--------------------------------$/ { capture = 0 }
            capture { print }
          ' "$temp_dir/functions-interpreter.log" > "$temp_dir/functions-interpreter.out"

          cargo run --quiet -- build "$functions_source" -o "$temp_dir/functions-native" > /dev/null
          "$temp_dir/functions-native" > "$temp_dir/functions-native.out"
          diff -u "$temp_dir/functions-interpreter.out" "$temp_dir/functions-native.out"

          cat > "$temp_dir/unsupported.hl" <<'EOF'
          let add = |x, y| (x + y);
          print add(1);
          EOF
          if cargo run --quiet -- build "$temp_dir/unsupported.hl" -o "$temp_dir/unsupported" > /dev/null 2>&1; then
            echo "El backend aceptó inesperadamente un programa con funciones no soportadas" >&2
            exit 1
          fi
          test ! -e "$temp_dir/unsupported"

          cat > "$temp_dir/runtime-error.hl" <<'EOF'
          print 1 / 0;
          EOF
          set +e
          cargo run --quiet -- run "$temp_dir/runtime-error.hl" > "$temp_dir/interpreter-error.out" 2> "$temp_dir/interpreter-error.err"
          interpreter_status=$?
          cargo run --quiet -- build "$temp_dir/runtime-error.hl" -o "$temp_dir/runtime-error" > /dev/null 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo "No se pudo compilar el caso de error de runtime" >&2
            exit "$build_status"
          fi
          "$temp_dir/runtime-error" > "$temp_dir/native-error.out" 2> "$temp_dir/native-error.err"
          native_status=$?
          set -e

          test "$interpreter_status" -eq 1
          test "$native_status" -eq "$interpreter_status"
          grep -q "Division by zero" "$temp_dir/interpreter-error.err"
          grep -q "Division by zero" "$temp_dir/native-error.err"

          cat > "$temp_dir/runtime-budget.hl" <<'EOF'
          let counter = 0;
          while (true) (
            counter = counter + 1;
          )
          EOF
          cargo run --quiet -- build "$temp_dir/runtime-budget.hl" -o "$temp_dir/runtime-budget" > /dev/null
          set +e
          HACKLANG_MAX_EVAL_STEPS=10 "$temp_dir/runtime-budget" > "$temp_dir/runtime-budget.out" 2> "$temp_dir/runtime-budget.err"
          budget_status=$?
          set -e
          test "$budget_status" -eq 1
          grep -q "presupuesto de instrucciones de ejecución nativa" "$temp_dir/runtime-budget.err"

          cat > "$temp_dir/runtime-time-budget.hl" <<'EOF'
          let counter = 0;
          while (true) (
            counter = counter + 1;
          )
          EOF
          cargo run --quiet -- build "$temp_dir/runtime-time-budget.hl" -o "$temp_dir/runtime-time-budget" > /dev/null
          set +e
          HACKLANG_MAX_EVAL_MILLIS=5 "$temp_dir/runtime-time-budget" > "$temp_dir/runtime-time-budget.out" 2> "$temp_dir/runtime-time-budget.err"
          time_status=$?
          set -e
          test "$time_status" -eq 1
          grep -q "presupuesto de tiempo de CPU de ejecución nativa" "$temp_dir/runtime-time-budget.err"

          cat > "$temp_dir/runtime-time-budget-nested.hl" <<'EOF'
          let spin = |limit| (
            let index = 0;
            while (index < limit) (
              index = index + 1;
            )
            return index;
          );
          let total = 0;
          while (true) (
            total = total + spin(1000);
          )
          EOF
          cargo run --quiet -- build "$temp_dir/runtime-time-budget-nested.hl" -o "$temp_dir/runtime-time-budget-nested" > /dev/null
          set +e
          HACKLANG_MAX_EVAL_STEPS=1000000000 HACKLANG_MAX_EVAL_MILLIS=50 "$temp_dir/runtime-time-budget-nested" > "$temp_dir/runtime-time-budget-nested.out" 2> "$temp_dir/runtime-time-budget-nested.err"
          nested_time_status=$?
          set -e
          test "$nested_time_status" -eq 1
          grep -q "presupuesto de tiempo de CPU de ejecución nativa" "$temp_dir/runtime-time-budget-nested.err"

          payload="$(head -c 8192 /dev/zero | tr '\0' 'a')"
          printf 'let payload = "%s";\nprint 1;\n' "$payload" > "$temp_dir/runtime-memory-budget.hl"
          cargo run --quiet -- build "$temp_dir/runtime-memory-budget.hl" -o "$temp_dir/runtime-memory-budget" > /dev/null
          set +e
          HACKLANG_MAX_ARENA_BYTES=4096 "$temp_dir/runtime-memory-budget" > "$temp_dir/runtime-memory-budget.out" 2> "$temp_dir/runtime-memory-budget.err"
          memory_status=$?
          set -e
          test "$memory_status" -eq 1
          grep -q "presupuesto de memoria de arenas nativas" "$temp_dir/runtime-memory-budget.err"

          : > "$temp_dir/runtime-heap-budget.hl"
          for index in $(seq 1 128); do
            printf 'let f%s = |x| (x + %s);\n' "$index" "$index" >> "$temp_dir/runtime-heap-budget.hl"
          done
          cargo run --quiet -- build "$temp_dir/runtime-heap-budget.hl" -o "$temp_dir/runtime-heap-budget" > /dev/null
          set +e
          HACKLANG_MAX_HEAP_BYTES=4096 "$temp_dir/runtime-heap-budget" > "$temp_dir/runtime-heap-budget.out" 2> "$temp_dir/runtime-heap-budget.err"
          heap_status=$?
          set -e
          test "$heap_status" -eq 1
          grep -q "presupuesto de memoria auxiliar del runtime nativo" "$temp_dir/runtime-heap-budget.err"

          small_payload="$(head -c 1024 /dev/zero | tr '\0' 's')"
          large_payload="$(head -c 4096 /dev/zero | tr '\0' 'l')"
          {
            printf 'let payload = "x";\n'
            printf 'let index = 0;\nwhile (index < 256) (\n'
            printf 'payload = "%s";\n' "$large_payload"
            printf 'payload = "%s";\n' "$small_payload"
            printf 'index = index + 1;\n)\nprint len(payload);\n'
          } > "$temp_dir/runtime-string-heap-budget.hl"
          cargo run --quiet -- build "$temp_dir/runtime-string-heap-budget.hl" -o "$temp_dir/runtime-string-heap-budget" > /dev/null
          set +e
          HACKLANG_MAX_HEAP_BYTES=4096 "$temp_dir/runtime-string-heap-budget" > "$temp_dir/runtime-string-heap-budget-limited.out" 2> "$temp_dir/runtime-string-heap-budget-limited.err"
          string_limited_status=$?
          set -e
          test "$string_limited_status" -eq 1
          grep -q "presupuesto de memoria auxiliar del runtime nativo" "$temp_dir/runtime-string-heap-budget-limited.err"

          HACKLANG_MAX_HEAP_BYTES=12288 "$temp_dir/runtime-string-heap-budget" > "$temp_dir/runtime-string-heap-budget.out" 2> "$temp_dir/runtime-string-heap-budget.err"
          grep -qx "1024" "$temp_dir/runtime-string-heap-budget.out"
