name: Rust CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Type-check
        run: cargo check
      - name: Build
        run: cargo build
      - name: Run unit tests
        run: cargo test
      - name: Execute every supported .hl example
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.hl; do
            echo "Checking $file"
            cargo run --quiet -- "$file"
          done
