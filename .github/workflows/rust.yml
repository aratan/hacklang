name: Rust CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Type-check
        run: cargo check
      - name: Build
        run: cargo build
      - name: Run unit tests
        run: cargo test
      - name: Execute every supported .hl example
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.hl; do
            echo "Checking $file"
            cargo run --quiet -- "$file"
          done
      - name: Compare interpreter and native backend
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          source="examples/native_smoke.hl"
          cargo run --quiet -- run "$source" > "$temp_dir/interpreter.log"
          awk '
            /^--- Ejecutando código Hacklang ---$/ { capture = 1; next }
            /^--------------------------------$/ { capture = 0 }
            capture { print }
          ' "$temp_dir/interpreter.log" > "$temp_dir/interpreter.out"

          cargo run --quiet -- build "$source" -o "$temp_dir/native" > /dev/null
          "$temp_dir/native" > "$temp_dir/native.out"
          diff -u "$temp_dir/interpreter.out" "$temp_dir/native.out"

          if cargo run --quiet -- build examples/test_functions.hl -o "$temp_dir/unsupported" > /dev/null 2>&1; then
            echo "El backend aceptó inesperadamente un programa con funciones no soportadas" >&2
            exit 1
          fi
          test ! -e "$temp_dir/unsupported"
